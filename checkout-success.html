<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Confirmed - SLG.art · Sarah L Glabman</title>
  <meta name="description" content="Thank you for your order at SLG.art." />
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Montserrat:wght@300;400;600;700&family=Open+Sans:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { background: var(--bg-2); }
    .cs-wrap {
      max-width: 560px; margin: clamp(3rem, 8vw, 6rem) auto; text-align: center;
      background: var(--bg); border: 1px solid var(--line); border-radius: 3px;
      padding: clamp(2.5rem, 6vw, 3.5rem) clamp(1.5rem, 5vw, 2.5rem);
    }
    .cs-icon {
      width: 60px; height: 60px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;
      background: var(--blue);
    }
    .cs-icon.pending { background: var(--gold); }
    .cs-icon.error   { background: #b02a37; }
    .cs-wrap h1 {
      font-family: var(--title); font-weight: 300;
      font-size: clamp(1.7rem, 4vw, 2.4rem); color: var(--blue); margin: 0 0 .85rem;
    }
    .cs-wrap p {
      color: var(--ink-muted); font-family: var(--sans); font-size: .95rem;
      line-height: 1.75; max-width: 42ch; margin: 0 auto 1rem;
    }
    .cs-meta {
      font-family: var(--display); font-size: .72rem; letter-spacing: .22em;
      text-transform: uppercase; color: var(--gold); margin: 1.4rem 0 2rem;
    }
    .cs-btn {
      display: inline-block; padding: .9rem 2.2rem; background: var(--blue); color: #fff;
      font-family: var(--display); font-size: .72rem; letter-spacing: .26em;
      text-transform: uppercase; text-decoration: none; border-radius: 2px; transition: background .2s;
    }
    .cs-btn:hover { background: var(--gold); }
    .cs-sub { font-size: .8rem; color: var(--ink-muted); margin-top: 1.5rem; }
    .cs-sub a { color: var(--gold-deep); text-decoration: none; }
  </style>
</head>
<body>

  <!-- Nav + Footer injected by components.js -->

  <main class="cs-wrap" id="csWrap">
    <div class="cs-icon" id="csIcon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 id="csTitle">Confirming your order…</h1>
    <p id="csMsg">One moment while we confirm your payment.</p>
    <p class="cs-meta" id="csMeta" style="display:none;"></p>
    <a href="index.html" class="cs-btn">Continue Browsing</a>
    <p class="cs-sub">Questions? <a href="mailto:Hello@SLG.art">Hello@SLG.art</a> · <a href="tel:+16029194444">602-919-4444</a></p>
  </main>

  <script src="assets/js/components.js"></script>
  <script>
  (function () {
    'use strict';
    const q = new URLSearchParams(location.search);
    const sid = q.get('session_id');
    const iconEl  = document.getElementById('csIcon');
    const titleEl = document.getElementById('csTitle');
    const msgEl   = document.getElementById('csMsg');
    const metaEl  = document.getElementById('csMeta');

    function setState(kind, title, msg) {
      iconEl.className = 'cs-icon' + (kind === 'ok' ? '' : ' ' + kind);
      if (kind === 'error')   iconEl.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      if (kind === 'pending') iconEl.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
      titleEl.textContent = title;
      msgEl.textContent = msg;
    }

    function clearCart() {
      try { localStorage.removeItem('slg_cart'); } catch (e) {}
      if (window.SLGCart && window.SLGCart.clear) window.SLGCart.clear();
    }

    if (!sid) {
      setState('error', 'No order found', 'We couldn’t find an order to confirm. If you were charged, please contact us and we’ll sort it out right away.');
      return;
    }

    fetch('stripe/verify-session.php?session_id=' + encodeURIComponent(sid))
      .then(r => r.json())
      .then(d => {
        if (d && d.paid) {
          clearCart();
          setState('ok', 'Thank you', 'Your order has been received and your payment confirmed. Sarah will personally be in touch within 1-2 business days to confirm your print and shipping details.');
          if (d.amount != null) {
            metaEl.style.display = '';
            metaEl.textContent = 'Total Paid · $' + Number(d.amount).toLocaleString('en-US');
          }
        } else {
          setState('pending', 'Payment not completed', 'It looks like your payment wasn’t completed. Your cart is still saved - you can return to checkout to try again.');
        }
      })
      .catch(() => {
        setState('pending', 'Couldn’t confirm just yet', 'We couldn’t confirm your payment automatically. If you completed payment, don’t worry - please contact us and we’ll verify your order.');
      });
  })();
  </script>

</body>
</html>
